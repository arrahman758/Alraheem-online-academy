<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داخلہ — الرحیم آن لائن قرآن اکیڈمی</title><meta name="description" content="گھر بیٹھے قرآن پاک ناظرہ، حفظ، تجوید اور ترجمہ و تفسیر کی آن لائن تعلیم"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="page-h"><div class="wrap"><h1>داخلہ فارم</h1></div></div>
<section><div class="wrap"><p style="text-align:center;margin-bottom:20px">فارم بھرنے کے بعد آپ کی معلومات واٹس اپ پر ہمیں بھیج دی جائیں گی۔</p>
<form id="enrollForm"><label>طالب علم کا نام</label><input name="name" required><label>عمر</label><input name="age" required><label>ملک / شہر</label><input name="city" required>
<label>کورس</label><select name="course"><option>نورانی قاعدہ</option><option>ناظرہ قرآن</option><option>حفظِ قرآن</option><option>تجوید</option><option>ترجمہ و تفسیر</option><option>دینیات و مسنون دعائیں</option></select>
<label>پسندیدہ وقت</label><input name="time" placeholder="مثلاً عصر کے بعد"><button class="btn wa" type="submit">💬 واٹس اپ پر بھیجیں</button></form></div></section>
<script src="main.js"></script></body></html>
